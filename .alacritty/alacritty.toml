[general]
live_config_reload = true
import = ["alacritty-os-specific.toml"]

[colors]
draw_bold_text_with_bright_colors = false

[font.bold]
family = "FiraCode Nerd Font"

[font.glyph_offset]
x = 0
y = 0

[font.italic]
family = "FiraCode Nerd Font"

[font.normal]
family = "FiraCode Nerd Font"

[font.offset]
x = 0
y = 0

[scrolling]
history = 10000
multiplier = 3

[window]
decorations = "full"
dynamic_padding = false
opacity = 0.85
startup_mode = "Maximized"

[window.padding]
x = 0
y = 0
