# ==========================
# ===  General settings  ===
# ==========================
set -s escape-time 0

set -g allow-passthrough on

# Auto rename windows based on current directory until renamed manually
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# Colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:RGB"

# Mouse mode
setw -g mouse on
set -as terminal-features ",*:hyperlinks"

# to be able to use shift+enter in tui apps
set -g extended-keys on

# ==========================
# ===   Key bindings     ===
# ==========================

# Send prefix
# set-option -g prefix C-t
# unbind C-t
# bind C-t send-prefix

# Remove space from copy mode
unbind -T copy-mode-vi Space
# Setup 'v' to begin selection, 'y' to copy selection as in Vim
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

# split current window
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

bind H resize-pane -L 25
bind J resize-pane -D 25
bind K resize-pane -U 25
bind L resize-pane -R 25

# start numbering at 1 instead of 0
set -g base-index 1 # windows
setw -g pane-base-index 1 # panes

# pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind p switch-client -T jump-pane
bind -T jump-pane 1 select-pane -t :.1
bind -T jump-pane 2 select-pane -t :.2
bind -T jump-pane 3 select-pane -t :.3
bind -T jump-pane 4 select-pane -t :.4
bind -T jump-pane 5 select-pane -t :.5
bind -T jump-pane 6 select-pane -t :.6
bind -T jump-pane 7 select-pane -t :.7
bind -T jump-pane 8 select-pane -t :.8
bind -T jump-pane 9 select-pane -t :.9

# new window and retain cwd
bind c new-window -c "#{pane_current_path}"

# Rename session and window
bind r command-prompt -I "#{b:pane_current_path}" "rename-window '%%'"
bind R command-prompt -I "#{session_name}" "rename-session '%%'"

# reload tmux config
bind ! source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux config"

# =====================================
# ===           Theme               ===
# =====================================
color_dark="colour232"
color_light="white"
color_session_text="colour39"
color_status_text="colour245"
color_main="colour166"
color_secondary="colour134"
color_level_ok="colour076"
color_level_warn="colour220"
color_level_stress="colour160"

# =====================================
# ===    Appearence and status bar  ===
# ======================================

set -g mode-style "fg=default,bg=$color_main"

# command line style
set -g message-style "fg=$color_main,bg=$color_dark"

# status line style
set -g status-style "fg=$color_status_text,bg=$color_dark"

setw -g window-status-style "fg=$color_status_text,bg=$color_dark"
setw -g window-status-format " #I:#W "
setw -g window-status-current-style "fg=$color_light,bold,bg=$color_main"
setw -g window-status-current-format "#[fg=$color_dark,bg=$color_main]$separator_powerline_right #I:#W #[fg=$color_main,bg=$color_dark]$separator_powerline_right"
setw -g pane-active-border-style "fg=$color_main"

set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format "#{?pane_active, #{?window_zoomed_flag,[,}[#{pane_index}]#{?window_zoomed_flag,],} #{b:pane_current_path} , [#{pane_index}] #{b:pane_current_path} }"

set -g status on
set -g status-interval 60
set -g status-position top
set -g status-right-length 150

wg_session="#[fg=$color_session_text] #S #[default]"
wg_activated_gh_account="#(~/dotfiles/scripts/get_activated_gh_account.sh)"
wg_meeting='󰜎 #(cli gcal in-progress --text --join ", ") | 󰔟 #(cli gcal soon --text --join ", ")'

set -g status-left "$wg_session"
set -g status-right "#{prefix_highlight} #[fg=$color_main]$wg_meeting #[default]| #[fg=$color_secondary]$wg_activated_gh_account  "

# Configure tmux-prefix-highlight
set -g @prefix_highlight_output_prefix '['
set -g @prefix_highlight_output_suffix ']'
set -g @prefix_highlight_fg "$color_dark"
set -g @prefix_highlight_bg "$color_secondary"
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr "fg=$color_dark,bg=$color_secondary"

# Rebuild opencode pane icons when a pane exits (TUI quit / pane killed)
set-hook -g pane-exited 'run-shell -b "~/dotfiles/scripts/tmux_opencode_pane_strip.sh"'
# Rebuild opencode pane icons when a new pane is created (TUI launched / pane split)
set -g focus-events on
set-hook -g pane-focus-in 'run-shell -b "~/dotfiles/scripts/tmux_opencode_pane_strip.sh"'

# ============================
# ===       Plugins        ===
# ============================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

run '~/.config/tmux/tpm/tpm'
